[project]
name = "studio-worker"
version = "0.1.0"
description = "AI Video Studio - motor editorial e audiovisual (FFmpeg + faster-whisper + Claude)"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9,<5",
  "httpx>=0.27",
  "boto3>=1.34",
  "anthropic>=0.70",
  "fastapi>=0.115",
  "pydantic>=2.7",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.1"]
ops = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "modal>=1.0", "psycopg[binary]>=3.2"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
  "ffmpeg: requires ffmpeg/ffprobe on PATH",
  "slow: long running (transcription)",
  "live: real cloud integration (Supabase); run with -m live",
]
